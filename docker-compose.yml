services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pg_dev_pw
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # SMTP de desenvolvimento: captura todos os e-mails. Interface em http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Armazenamento S3-compatível de DEV (anexos). SeaweedFS no lugar do MinIO, que deixou de publicar
  # imagens Docker públicas. A API fala S3 puro: em produção use AWS S3, R2, MinIO etc.
  s3:
    image: chrislusf/seaweedfs:3.96
    restart: unless-stopped
    command: server -dir=/data -master.volumeSizeLimitMB=64 -volume.max=100 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - s3data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pgdata:
  s3data:
