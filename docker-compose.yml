services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pg_dev_pw
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # SMTP de desenvolvimento: captura todos os e-mails. Interface em http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Armazenamento S3-compatível de DEV (anexos). SeaweedFS no lugar do MinIO, que deixou de publicar
  # imagens Docker públicas. A API fala S3 puro: em produção use AWS S3, R2, MinIO etc.
  s3:
    image: chrislusf/seaweedfs:3.96
    restart: unless-stopped
    command: server -dir=/data -master.volumeSizeLimitMB=64 -volume.max=100 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - s3data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # ---------------- aplicação completa em containers: docker compose --profile full up -d --build
  # (antes: ./db/dev-reset.sh no host para criar roles, migrations e seed)
  api:
    profiles: [full]
    build: { context: ., dockerfile: api/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment: &app-env
      NODE_ENV: production
      DATABASE_URL: postgresql://sd_app:app_dev_pw@db:5432/helpdesk
      DATABASE_URL_WORKER: postgresql://sd_worker:worker_dev_pw@db:5432/helpdesk
      S3_ENDPOINT: http://s3:8333
      S3_PUBLIC_ENDPOINT: http://localhost:8333
      SMTP_HOST: mailpit
      APP_URL: http://localhost:8080
      CORS_ORIGIN: http://localhost:8080
      TRUST_PROXY: "1"
    depends_on: [db, s3]

  worker:
    profiles: [full]
    build: { context: ., dockerfile: api/Dockerfile }
    restart: unless-stopped
    command: ["node", "dist/worker/main.js"]
    healthcheck: { disable: true }
    env_file: .env
    environment: *app-env
    depends_on: [db, mailpit]

  web:
    profiles: [full]
    build: { context: ., dockerfile: web/Dockerfile }
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on: [api]

volumes:
  pgdata:
  s3data:
